name: Build iOS IPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: ./tongkrongan_app
        run: flutter pub get

      - name: Run analysis
        working-directory: ./tongkrongan_app
        run: flutter analyze
        continue-on-error: true

      - name: Install pods
        working-directory: ./tongkrongan_app/ios
        run: |
          pod repo update
          pod install --repo-update

      - name: Decode provisioning profile
        run: |
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Decode signing certificate
        run: |
          echo "${{ secrets.IOS_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12
          
          # Import certificate to keychain
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

      - name: Build iOS (Debug)
        working-directory: ./tongkrongan_app
        run: |
          flutter build ios --debug -v
        if: github.event_name == 'pull_request'
        continue-on-error: true

      - name: Build iOS (Release)
        working-directory: ./tongkrongan_app
        run: |
          flutter build ios --release -v

      - name: Generate version tag
        id: version
        run: |
          VERSION=$(date +'%Y%m%d_%H%M%S')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "IPA Version: $VERSION"

      - name: Export iOS App to Archive
        working-directory: ./tongkrongan_app
        run: |
          mkdir -p build/ios/archive
          
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/ios/DerivedData \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive

      - name: Export iOS App to IPA
        working-directory: ./tongkrongan_app
        run: |
          mkdir -p build/ios/ipa
          
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -verbose

      - name: List IPA files
        working-directory: ./tongkrongan_app
        run: |
          ls -lah build/ios/ipa/
          find build/ios/ipa -name "*.ipa"

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tongkrongan-${{ steps.version.outputs.version }}.ipa
          path: tongkrongan_app/build/ios/ipa/Tongkrongan.ipa
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ios-${{ steps.version.outputs.version }}
          release_name: iOS Release ${{ steps.version.outputs.version }}
          body: |
            ## iOS Build
            - **Version:** ${{ steps.version.outputs.version }}
            - **Branch:** main
            - **Commit:** ${{ github.sha }}
            
            ### Download
            - IPA: [Download](../../releases/download/ios-${{ steps.version.outputs.version }}/Tongkrongan-${{ steps.version.outputs.version }}.ipa)
            
            ### Installation
            1. Use Sideloadly or similar tool
            2. Or upload to TestFlight for beta testing
          draft: false
          prerelease: false

      - name: Upload IPA to Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: tongkrongan_app/build/ios/ipa/Tongkrongan.ipa
          asset_name: Tongkrongan-${{ steps.version.outputs.version }}.ipa
          asset_content_type: application/octet-stream

      - name: Upload to Sideloadly (Optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Sideloadly CLI atau API call
          curl -X POST https://api.sideloadly.io/upload \
            -H "Authorization: Bearer ${{ secrets.SIDELOADLY_API_KEY }}" \
            -F "file=@tongkrongan_app/build/ios/ipa/Tongkrongan.ipa" \
            -F "device_id=${{ secrets.SIDELOADLY_DEVICE_ID }}" \
            -F "auto_install=true"
        continue-on-error: true

      - name: Upload to TestFlight (Optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Requires TESTFLIGHT_USERNAME, TESTFLIGHT_PASSWORD, TESTFLIGHT_APP_ID
          xcrun altool --upload-app \
            -f tongkrongan_app/build/ios/ipa/Tongkrongan.ipa \
            -t ios \
            -u "${{ secrets.TESTFLIGHT_USERNAME }}" \
            -p "${{ secrets.TESTFLIGHT_PASSWORD }}" \
            --verbose
        continue-on-error: true

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain

      - name: Post Build Status
        if: always()
        run: |
          echo "✅ iOS IPA Build Complete"
          echo "Build artifacts available in Actions"
