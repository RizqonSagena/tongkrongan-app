name: Build Flutter Apps (APK & IPA)

# Workflow triggers
# - Push to main/develop branches
# - Manual trigger (workflow_dispatch)
# - Pull requests to main
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
  pull_request:
    branches:
      - main

# Prevent multiple concurrent builds on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Environment variables for build configuration
env:
  FLUTTER_VERSION: 3.24.0
  JAVA_VERSION: 17
  APP_NAME: tongkrongan_app
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  # ============================================================================
  # ANDROID BUILD JOB - Generates APK artifact
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        working-directory: ${{ env.APP_NAME }}
        run: |
          flutter clean
          flutter pub get
      - name: Build APK Release
        working-directory: ${{ env.APP_NAME }}
        run: |
          echo "🔨 Starting Android APK build..."
          flutter build apk --release --verbose
          echo "✅ Android APK build completed successfully"

      - name: Verify APK artifact
        run: |
          APK_PATH="${{ env.APP_NAME }}/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ Error: APK file not found at $APK_PATH!"
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "✓ APK size: $APK_SIZE"
          ls -lh "$APK_PATH"

      - name: Generate build metadata
        id: apk_meta
        run: |
          BUILD_TIME=$(date -u +'%Y-%m-%d_%H-%M-%S')
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "BUILD_INFO: $BUILD_TIME / $COMMIT_SHA"

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_NAME }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          compression-level: 0

  # ============================================================================
  # iOS BUILD JOB - Generates unsigned IPA artifact
  # ============================================================================
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        working-directory: ${{ env.APP_NAME }}
        run: |
          flutter clean
          flutter pub get
      - name: Build iOS Release (unsigned)
        working-directory: ${{ env.APP_NAME }}
        run: |
          echo "🔨 Starting iOS IPA build (unsigned)..."
          flutter build ios --release --no-codesign --verbose
          echo "✅ iOS build completed successfully"

      - name: Package iOS Build as IPA
        working-directory: ${{ env.APP_NAME }}/build/ios/iphoneos
        run: |
          echo "📦 Packaging iOS app as IPA..."
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r -q Runner.ipa Payload
          mv Runner.ipa ../../..
          echo "✓ IPA packaging completed"

      - name: Verify IPA artifact
        working-directory: ${{ env.APP_NAME }}
        run: |
          IPA_PATH="Runner.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            echo "❌ Error: IPA file not found at $IPA_PATH!"
            exit 1
          fi
          IPA_SIZE=$(du -h "$IPA_PATH" | cut -f1)
          echo "✓ IPA size: $IPA_SIZE"
          ls -lh "$IPA_PATH"
          echo ""
          echo "IPA Contents (first 20 entries):"
          unzip -t "$IPA_PATH" | head -20

      - name: Generate build metadata
        id: ipa_meta
        run: |
          BUILD_TIME=$(date -u +'%Y-%m-%d_%H-%M-%S')
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "BUILD_INFO: $BUILD_TIME / $COMMIT_SHA"

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: ${{ env.APP_NAME }}/Runner.ipa
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          compression-level: 0

  # ============================================================================
  # BUILD COMPLETION NOTIFICATION JOB
  # ============================================================================
  notify-completion:
    name: Notify Build Completion
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check build status
        run: |
          ANDROID_STATUS="${{ needs.build-android.result }}"
          iOS_STATUS="${{ needs.build-ios.result }}"
          
          echo "📋 BUILD STATUS REPORT"
          echo "======================"
          echo "Android APK: $ANDROID_STATUS"
          echo "iOS IPA:    $iOS_STATUS"
          
          if [ "$ANDROID_STATUS" == "success" ] && [ "$iOS_STATUS" == "success" ]; then
            echo ""
            echo "✅ Both Android APK and iOS IPA builds completed successfully!"
            exit 0
          else
            echo ""
            echo "⚠️  Build completed with some issues"
            if [ "$ANDROID_STATUS" != "success" ]; then
              echo "  ❌ Android APK: $ANDROID_STATUS"
            fi
            if [ "$iOS_STATUS" != "success" ]; then
              echo "  ❌ iOS IPA: $iOS_STATUS"
            fi
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "📥 ARTIFACTS AVAILABLE:"
          echo "========================"
          echo "1. android-apk      → app-release.apk"
          echo "2. ios-ipa-unsigned → Runner.ipa (unsigned)"
          echo ""
          echo "📌 Download artifacts from: Actions → Workflow Run → Artifacts"
          echo ""
          echo "Build Details:"
          echo "  Workflow: ${{ github.workflow }}"
          echo "  Trigger:  ${{ github.event_name }}"
          echo "  Branch:   ${{ github.ref_name }}"
          echo "  Commit:   ${{ github.sha }}"

