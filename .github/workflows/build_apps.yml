name: Build Flutter Apps (APK & IPA)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Check environment
        run: |
          echo "=== Flutter ===" 
          flutter --version
          echo "=== Dart ==="
          dart --version
          echo "=== Java ==="
          java -version
          echo "=== Gradle ==="
          which gradle
          echo "=== PWD ==="
          pwd
          echo "=== Files ==="
          ls -la
          echo "=== tongkrongan_app ==="
          ls -la tongkrongan_app/
      
      - name: Clean flutter
        run: |
          cd tongkrongan_app
          flutter clean
      
      - name: Get dependencies
        run: |
          cd tongkrongan_app
          flutter pub get 2>&1 | tail -20
      
      - name: Build APK
        run: |
          cd tongkrongan_app
          echo "Starting APK build..."
          flutter build apk --release 2>&1
          echo "Build completed, checking output..."
          ls -la build/app/outputs/flutter-apk/ 2>&1 || echo "flutter-apk not found"
          find . -name "app-release.apk" -type f 2>&1 || echo "No APK found anywhere"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: tongkrongan_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Check environment
        run: |
          echo "=== Flutter ===" 
          flutter --version
          echo "=== Dart ==="
          dart --version
          echo "=== Xcode ==="
          xcode-select -p
          echo "=== PWD ==="
          pwd
          echo "=== Files ==="
          ls -la
      
      - name: Clean flutter
        run: |
          cd tongkrongan_app
          flutter clean
      
      - name: Get dependencies
        run: |
          cd tongkrongan_app
          flutter pub get 2>&1 | tail -20
      
      - name: Build iOS
        run: |
          cd tongkrongan_app
          echo "Starting iOS build..."
          flutter build ios --release --no-codesign 2>&1
          echo "Build completed, checking output..."
          ls -la build/ios/iphoneos/ 2>&1 || echo "iphoneos not found"
          find . -name "Runner.app" -type d 2>&1 || echo "No Runner.app found"
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa-unsigned
          path: tongkrongan_app/build/ios/iphoneos/Runner.app
          retention-days: 30
          if-no-files-found: warn
