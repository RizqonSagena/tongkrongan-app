name: Build Flutter Apps (APK & IPA)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter clean
        working-directory: tongkrongan_app
      - run: flutter pub get
        working-directory: tongkrongan_app
      - run: flutter build apk --release
        working-directory: tongkrongan_app
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: tongkrongan_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter clean
        working-directory: tongkrongan_app
      - run: flutter pub get
        working-directory: tongkrongan_app
      - run: flutter build ios --release --no-codesign
        working-directory: tongkrongan_app
      - run: |
          cd tongkrongan_app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          cd Payload
          zip -r -q ../Runner.ipa .
          cd ..
          ls -lh Runner.ipa
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: tongkrongan_app/build/ios/iphoneos/Runner.ipa
          retention-days: 30
