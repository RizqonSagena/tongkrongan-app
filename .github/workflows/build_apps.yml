name: Build Flutter Apps (APK & IPA)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - run: |
          cd tongkrongan_app
          flutter clean
          flutter pub get
        name: Get dependencies
      
      - run: |
          cd tongkrongan_app
          flutter build apk --release
        name: Build APK
      
      - run: ls -lh tongkrongan_app/build/app/outputs/flutter-apk/
        name: List APK files
        if: always()
      
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: tongkrongan_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - run: |
          cd tongkrongan_app
          flutter clean
          flutter pub get
        name: Get dependencies
      
      - run: |
          cd tongkrongan_app
          flutter build ios --release --no-codesign
        name: Build iOS
      
      - run: |
          cd tongkrongan_app/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Runner.ipa Payload/
          ls -lh Runner.ipa
        shell: bash
        name: Package IPA
      
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-ipa-unsigned
          path: tongkrongan_app/build/ios/iphoneos/Runner.ipa
          retention-days: 30
