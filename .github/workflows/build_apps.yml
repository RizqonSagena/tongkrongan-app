name: Build Flutter Apps (APK & IPA)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - run: |
          flutter --version
          dart --version
        name: Check versions
      
      - run: |
          cd tongkrongan_app
          flutter clean
          flutter pub get
          flutter build apk --release -v
        name: Build APK
      
      - run: |
          ls -la tongkrongan_app/build/app/outputs/flutter-apk/ || echo "APK folder not found"
          find tongkrongan_app/build -name "*.apk" -type f || echo "No APK files found"
        name: Check APK output
        if: always()
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: tongkrongan_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - run: |
          flutter --version
          dart --version
        name: Check versions
      
      - run: |
          cd tongkrongan_app
          flutter clean
          flutter pub get
          flutter build ios --release --no-codesign -v
        name: Build iOS
      
      - run: |
          ls -la tongkrongan_app/build/ios/iphoneos/ || echo "iphoneos folder not found"
          find tongkrongan_app/build -name "Runner.app" -type d || echo "No Runner.app found"
        name: Check iOS output
        if: always()
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa-unsigned
          path: tongkrongan_app/build/ios/iphoneos/Runner.app
          retention-days: 30
