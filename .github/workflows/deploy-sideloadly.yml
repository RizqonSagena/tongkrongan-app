name: Deploy to Sideloadly

on:
  workflow_run:
    workflows: ["Build Android APK", "Build iOS IPA"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      artifact_type:
        description: 'Artifact type to deploy'
        required: true
        type: choice
        options:
          - android
          - ios
          - both

jobs:
  deploy-android:
    name: Deploy APK to Sideloadly
    runs-on: ubuntu-latest
    if: |
      (github.event.workflow_run.conclusion == 'success' && 
       github.event.workflow_run.name == 'Build Android APK') ||
      github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Find APK File
        id: find_apk
        run: |
          APK_FILE=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "APK file not found"
            exit 1
          fi
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "APK found at: $APK_FILE"
          ls -lh "$APK_FILE"

      - name: Install Sideloadly CLI
        run: |
          # For Ubuntu/Linux - install via package manager or download
          # Check if sideloadly-cli is available
          
          # Option 1: Install via npm (if available)
          npm install -g sideloadly-cli || echo "npm install failed"
          
          # Option 2: Download binary
          wget -q https://sideloadly.io/downloads/cli/linux/sideloadly-cli -O /usr/local/bin/sideloadly
          chmod +x /usr/local/bin/sideloadly
          
          # Verify installation
          which sideloadly || echo "Sideloadly CLI not found in PATH"

      - name: Deploy APK via Sideloadly API
        run: |
          APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
          
          # Using curl with Sideloadly API
          curl -X POST https://api.sideloadly.io/v1/upload \
            -H "Authorization: Bearer ${{ secrets.SIDELOADLY_API_KEY }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@${APK_FILE}" \
            -F "device_id=${{ secrets.SIDELOADLY_DEVICE_ID }}" \
            -F "auto_install=true" \
            -F "app_type=android" \
            -v

      - name: Alternative: Deploy via direct Sideloadly command
        if: failure()
        run: |
          APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
          
          # If API fails, try direct CLI method
          # This requires Sideloadly desktop app running
          sideloadly install \
            --file "$APK_FILE" \
            --device "${{ secrets.SIDELOADLY_DEVICE_ID }}" \
            --auto-install true
        continue-on-error: true

      - name: Notify APK Deployment
        if: success()
        run: |
          echo "✅ APK successfully deployed to Sideloadly!"
          echo "Device: ${{ secrets.SIDELOADLY_DEVICE_ID }}"
          echo "File: ${{ steps.find_apk.outputs.apk_path }}"

      - name: Notify APK Deployment Failed
        if: failure()
        run: |
          echo "❌ APK deployment failed"
          echo "Check Sideloadly API key and device ID"

  deploy-ios:
    name: Deploy IPA to Sideloadly
    runs-on: ubuntu-latest
    if: |
      (github.event.workflow_run.conclusion == 'success' && 
       github.event.workflow_run.name == 'Build iOS IPA') ||
      github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Find IPA File
        id: find_ipa
        run: |
          IPA_FILE=$(find . -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "IPA file not found"
            exit 1
          fi
          echo "ipa_path=$IPA_FILE" >> $GITHUB_OUTPUT
          echo "IPA found at: $IPA_FILE"
          ls -lh "$IPA_FILE"

      - name: Deploy IPA via Sideloadly API
        run: |
          IPA_FILE="${{ steps.find_ipa.outputs.ipa_path }}"
          
          # Using curl with Sideloadly API
          curl -X POST https://api.sideloadly.io/v1/upload \
            -H "Authorization: Bearer ${{ secrets.SIDELOADLY_API_KEY }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@${IPA_FILE}" \
            -F "device_id=${{ secrets.SIDELOADLY_DEVICE_ID }}" \
            -F "auto_install=true" \
            -F "app_type=ios" \
            -v

      - name: Notify IPA Deployment
        if: success()
        run: |
          echo "✅ IPA successfully deployed to Sideloadly!"
          echo "Device: ${{ secrets.SIDELOADLY_DEVICE_ID }}"
          echo "File: ${{ steps.find_ipa.outputs.ipa_path }}"

      - name: Notify IPA Deployment Failed
        if: failure()
        run: |
          echo "❌ IPA deployment failed"
          echo "Check Sideloadly API key and device ID"

  notify-all:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-android, deploy-ios]
    if: always()
    
    steps:
      - name: Check Overall Status
        run: |
          echo "📱 Deployment Summary"
          echo "===================="
          echo "Android APK: ${{ needs.deploy-android.result }}"
          echo "iOS IPA: ${{ needs.deploy-ios.result }}"

      - name: Success Notification
        if: |
          needs.deploy-android.result == 'success' ||
          needs.deploy-ios.result == 'success'
        run: |
          echo "✅ Build and deployment completed!"
          echo "Check your device for the installed app"

      - name: Failed Notification
        if: |
          needs.deploy-android.result == 'failure' &&
          needs.deploy-ios.result == 'failure'
        run: |
          echo "❌ Deployment failed for both platforms"
          echo "Check GitHub Actions logs for details"
